version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ppe-backend
    ports:
      - "8000:8000"
    volumes:
      - ./model/weights:/app/model_weights:ro
    environment:
      - MODEL_WEIGHTS_PATH=/app/model_weights/ppe_best.pt
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ppe-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
